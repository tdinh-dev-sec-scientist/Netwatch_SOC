name: CI

# Render deploys the demo only when these checks pass on main
# (autoDeployTrigger: checksPass in render.yaml), so this workflow is also the
# deployment gate.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit and integration tests
        run: python -m pytest

      # Exits non-zero if throughput misses its target, p95 query latency
      # exceeds 50 ms, or alert deduplication drops a distinct incident.
      - name: Benchmark gates
        run: python benchmark.py --iterations 3 --packets 10000 --json benchmark-results.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-py${{ matrix.python-version }}
          path: benchmark-results.json
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Image and deployment smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Build the test stage (runs the suite inside the image)
        run: docker build --target test -t netwatch-soc:test .

      - name: Build the runtime image
        run: docker build --target runtime -t netwatch-soc:latest .

      # The same environment render.yaml gives the public demo, on the
      # platform-assigned PORT.
      - name: Smoke test - public demo settings
        run: scripts/smoke_test.sh demo

      - name: Smoke test - compose all-in-one
        run: scripts/smoke_test.sh all-in-one

      - name: Smoke test - compose split (one engine, two API replicas)
        run: scripts/smoke_test.sh split
