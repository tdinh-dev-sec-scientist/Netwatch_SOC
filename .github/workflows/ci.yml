name: CI

# Render deploys the demo only when these checks pass on main
# (autoDeployTrigger: checksPass in render.yaml), so this workflow is also the
# deployment gate.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # The suite runs against a real PostgreSQL, because the differences that
    # matter — strict typing, JSONB, the planner's choices — are invisible to a
    # test that only ever sees SQLite. Pinned to the same major version as
    # docker-compose.yml and the deployed database.
    services:
      postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_DB: netwatch
          POSTGRES_USER: netwatch
          POSTGRES_PASSWORD: netwatch
        ports:
          - 5432:5432
        # The job's steps do not start until this passes, so nothing races initdb.
        options: >-
          --health-cmd "pg_isready -U netwatch -d netwatch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The fixtures create and drop netwatch_test_* databases alongside this
      # one; the benchmark creates and drops a netwatch_bench_<pid>. Both need
      # the CREATEDB the postgres superuser already has.
      DATABASE_URL: postgresql://netwatch:netwatch@localhost:5432/netwatch
      TEST_DATABASE_URL: postgresql://netwatch:netwatch@localhost:5432/netwatch

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrations apply from an empty database, and are idempotent
        run: |
          python migrate.py up
          python migrate.py status
          python migrate.py up          # a second run must be a no-op

      - name: Unit and integration tests
        run: python -m pytest

      # The SQLite path is a documented development fallback, so it has to keep
      # working. Tests that assert PostgreSQL-specific behaviour skip themselves.
      - name: Unit and integration tests (SQLite fallback)
        env:
          DB_BACKEND: sqlite
        run: python -m pytest

      # pytest.ini scopes a bare run to `tests`, so the Splunk integration's
      # suite has to be named explicitly or it never runs. It needs the same
      # PostgreSQL service: with TEST_DATABASE_URL set, the forwarder's
      # cross-backend tests compare real PostgreSQL rows against SQLite ones
      # instead of skipping.
      - name: Splunk integration tests
        run: python -m pytest integrations/splunk

      # Exits non-zero if throughput misses its target, p95 query latency
      # exceeds 50 ms, or alert deduplication drops a distinct incident.
      - name: Benchmark gates
        run: python benchmark.py --iterations 3 --packets 10000 --json benchmark-results.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-py${{ matrix.python-version }}
          path: benchmark-results.json
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Image and deployment smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Build the test stage (runs the suite inside the image)
        run: docker build --target test -t netwatch-soc:test .

      - name: Build the runtime image
        run: docker build --target runtime -t netwatch-soc:latest .

      # The same environment render.yaml gives the public demo, on the
      # platform-assigned PORT.
      - name: Smoke test - public demo settings
        run: scripts/smoke_test.sh demo

      - name: Smoke test - compose all-in-one
        run: scripts/smoke_test.sh all-in-one

      - name: Smoke test - compose split (one engine, two API replicas)
        run: scripts/smoke_test.sh split
