name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      # ruff check enforces line length, import ordering, unused code, bug
      # patterns and a large slice of pycodestyle/pyflakes. `ruff format` is
      # deliberately not enforced: this codebase aligns tables, argument lists
      # and comment blocks by hand for readability, and a formatter would
      # flatten that without making anything more correct.
      - name: ruff check
        run: ruff check --output-format=github .

      - name: Compile every module
        run: python -m compileall -q netwatch benchmarks tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # The suite runs against a real PostgreSQL. Nothing here is mocked: the
    # schema, the constraints, the COPY write path and the query plans are all
    # PostgreSQL behaviour, and a fake would only prove the fake works.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netwatch
          POSTGRES_PASSWORD: netwatch
          POSTGRES_DB: netwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NETWATCH_TEST_DATABASE_URL: postgresql+psycopg://netwatch:netwatch@localhost:5432/netwatch_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Alembic migrations apply to an empty database
        env:
          NETWATCH_DATABASE_URL: postgresql+psycopg://netwatch:netwatch@localhost:5432/netwatch_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: pytest with coverage
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml \
                 --junitxml=junit.xml

      - name: Enforce the coverage floor
        run: coverage report --fail-under=85

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
          retention-days: 7

  benchmarks:
    name: Benchmarks (smoke)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netwatch
          POSTGRES_PASSWORD: netwatch
          POSTGRES_DB: netwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NETWATCH_DATABASE_URL: postgresql+psycopg://netwatch:netwatch@localhost:5432/netwatch

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      # A shared CI runner is the wrong place to measure throughput, so this
      # job asserts the harness still runs and the loss ledger still balances.
      # The numbers in the README come from the documented local runs.
      - name: Pipeline benchmark
        run: python -m benchmarks.pipeline_benchmark --packets 5000 --repeats 1
      - name: Soak test (short)
        run: python -m benchmarks.soak_test --minutes 0.5 --rate 1500
      - name: Query benchmark (small dataset)
        run: |
          python -m benchmarks.query_benchmark \
            --alerts 20000 --packets 20000 --hosts 500 --repeats 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmarks/results/*.json
          retention-days: 14

  docker:
    name: Docker build and stack smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: netwatch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the test stage inside the image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          cache-from: type=gha

      - name: Bring the stack up and check it is actually serving
        run: |
          docker compose up -d --wait --wait-timeout 240
          docker compose ps
          curl -fsS http://127.0.0.1:5001/api/health | tee /tmp/health.json
          python - <<'PY'
          import json, sys
          health = json.load(open('/tmp/health.json'))
          assert health['status'] == 'ok', health
          assert health['table_count'] == 10, health
          assert health['schema_complete'] is True, health
          print('health OK:', health['server_version'])
          PY

      - name: The engine container is actually ingesting
        run: |
          sleep 20
          curl -fsS 'http://127.0.0.1:5001/api/stats/overview' | tee /tmp/overview.json
          python - <<'PY'
          import json
          overview = json.load(open('/tmp/overview.json'))
          assert overview['total_packets'] > 0, overview
          assert overview['hosts_tracked'] > 0, overview
          print('ingested', overview['total_packets'], 'packets')
          PY

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
