# NetWatch SOC — container topology.
#
#   docker compose --profile all-in-one up -d --build   engine + API in one process
#   docker compose --profile split up -d --build        dedicated engine + API replicas
#   docker compose --profile test run --rm tests
#   docker compose up -d postgres                       just the database, for local dev
#
# Every application service belongs to exactly one profile, and the profiles are
# mutually exclusive by design. The all-in-one service used to have no profile,
# which made it start alongside `--profile split` as well: two engines recording
# the same network twice. CI checks that each profile runs exactly one engine.
# `postgres` is the exception and belongs to all of them — it is shared
# infrastructure, not a topology.
#
# The `version:` key is deliberately absent — it is obsolete in Compose v2+ and
# emits a warning.
#
# Default posture is defence-in-depth: non-root, read-only root filesystem, all
# Linux capabilities dropped, privilege escalation blocked, and no host network
# access. See the note at the bottom about live packet capture, which is the one
# mode that genuinely needs elevated privileges.
#
# Credentials come from .env (see .env.example). The defaults below are
# development values and are not a secret; a real deployment supplies
# DATABASE_URL from its platform's secret store and does not run this file's
# postgres service at all.

x-hardening: &hardening
  # Blocks setuid binaries from gaining privileges — stops a compromised
  # process escalating even if such a binary exists in the image.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # The application binds one port and opens database connections. It writes
  # nothing to disk, which is why the root filesystem can be read-only.
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  # Gunicorn's worker heartbeat lives in /dev/shm (see gunicorn.conf.py).
  shm_size: 64m
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-app-env: &app-env
  DB_BACKEND: postgresql
  DATABASE_URL: >-
    postgresql://${POSTGRES_USER:-netwatch}:${POSTGRES_PASSWORD:-netwatch}@postgres:5432/${POSTGRES_DB:-netwatch}
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

x-postgres-dependency: &needs-postgres
  postgres:
    # Not service_started: the application applies migrations on startup, so it
    # must not run before the server is accepting connections.
    condition: service_healthy

services:
  # ── database ──────────────────────────────────────────────────────────────
  # Pinned to a patch release so a rebuild cannot silently move major version;
  # upgrading across one needs pg_upgrade or a dump/restore, not a new tag.
  postgres:
    profiles: ["all-in-one", "split", "test", "db"]
    image: postgres:16.13-alpine
    container_name: netwatch-postgres
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netwatch}
      POSTGRES_USER: ${POSTGRES_USER:-netwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netwatch}
      # scram-sha-256 rather than the image's md5 default.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # Keeps the data directory one level down, so an anonymous volume or a
      # lost+found directory in the mount cannot make initdb refuse to start.
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    ports:
      # Loopback only: the database must not be reachable off-host. Published
      # at all so `pytest` and `psql` can reach it from the host during
      # development; drop this mapping in any shared environment.
      - "127.0.0.1:5432:5432"
    volumes:
      - netwatch-pgdata:/var/lib/postgresql/data
    healthcheck:
      # -d and -U are needed or pg_isready checks the wrong database and
      # reports ready while initdb is still running its bootstrap pass.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netwatch} -d ${POSTGRES_DB:-netwatch}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  # ── all-in-one: engine and API in one process ─────────────────────────────
  # One process owns both the detection engine and the API, so there is exactly
  # one traffic generator. gunicorn.conf.py refuses to start this with >1 worker.
  netwatch:
    profiles: ["all-in-one"]
    build:
      context: .
      target: runtime
      args:
        PYTHON_IMAGE: python:3.11-slim-bookworm
    image: netwatch-soc:latest
    container_name: netwatch-soc
    <<: *hardening
    environment:
      <<: *app-env
      NETWATCH_SIMULATE: "1"
      GUNICORN_WORKERS: "1"
      GUNICORN_THREADS: "8"
      GUNICORN_LOGLEVEL: info
      # One connection per thread, plus the engine's writer.
      PG_POOL_MAX: "9"
    ports:
      # Bound to loopback: this app has no authentication, so it must sit
      # behind a reverse proxy that terminates TLS and authenticates before
      # it is reachable off-host. Change to "5001:5001" only deliberately.
      - "127.0.0.1:5001:5001"
    depends_on: *needs-postgres
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json,sys,urllib.request
          d=json.load(urllib.request.urlopen('http://127.0.0.1:5001/api/health',timeout=4))
          sys.exit(0 if d.get('status')=='ok' and d.get('table_count')==8 else 1)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
        reservations:
          memory: 128M

  # ── split topology (profile: split) ───────────────────────────────────────
  # One writer, many readers. Under PostgreSQL the API replicas need nothing but
  # DATABASE_URL — no shared filesystem, no WAL sidecar files — so they can run
  # on separate hosts, which is what this topology could not do over SQLite.
  engine:
    build:
      context: .
      target: runtime
    image: netwatch-soc:latest
    container_name: netwatch-engine
    profiles: ["split"]
    <<: *hardening
    command: ["python", "engine.py"]
    entrypoint: []           # override gunicorn; this service serves no HTTP
    environment:
      <<: *app-env
      NETWATCH_SIMULATE: "1"
      NETWATCH_RATE_PPS: "95"
      # One writer and one reader for the periodic latency sample.
      PG_POOL_MAX: "2"
    depends_on: *needs-postgres
    healthcheck:
      # No HTTP surface, so health is "is the database still advancing?".
      test:
        - CMD
        - python
        - -c
        - |
          import os,sys,time,psycopg
          with psycopg.connect(os.environ['DATABASE_URL'], connect_timeout=5) as c:
              fresh=c.execute('SELECT COUNT(*) FROM packets WHERE ts > %s', (time.time()-120,)).fetchone()[0]
          sys.exit(0 if fresh > 0 else 1)
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  web:
    build:
      context: .
      target: runtime
    image: netwatch-soc:latest
    profiles: ["split"]
    <<: *hardening
    environment:
      <<: *app-env
      # Read-only API: no engine in these processes, so multiple workers are
      # safe and gunicorn.conf.py permits them.
      NETWATCH_SIMULATE: "0"
      GUNICORN_WORKERS: "4"
      GUNICORN_THREADS: "4"
      # Per worker process, so this tier can hold up to replicas x workers x
      # PG_POOL_MAX connections. Keep the product under the server's
      # max_connections (100 by default) with room for the engine.
      PG_POOL_MAX: "4"
      # GUNICORN_FORWARDED_ALLOW_IPS is deliberately unset, so no
      # X-Forwarded-* header is trusted. It previously held a CIDR range,
      # which gunicorn 23 rejects at startup ("does not appear to be an IPv4
      # or IPv6 address"), so these replicas crash-looped and never served.
      # No reverse proxy is defined in this file anyway; when you add one,
      # list its exact address(es) here, not a range.
    ports:
      # One host port per replica. A single fixed port cannot be published
      # by two containers, so the second replica used to fail to start with
      # "port is already allocated". Keep the range as wide as `replicas`.
      - "127.0.0.1:5001-5002:5001"
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json,sys,urllib.request
          d=json.load(urllib.request.urlopen('http://127.0.0.1:5001/api/health',timeout=4))
          sys.exit(0 if d.get('status')=='ok' else 1)
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # ── test / benchmark (profile: test) ──────────────────────────────────────
  tests:
    build:
      context: .
      target: test
    image: netwatch-soc:test
    profiles: ["test"]
    <<: *hardening
    read_only: false          # pytest and pip write temporary files
    restart: "no"
    entrypoint: []
    command: ["python", "-m", "pytest", "-q"]
    environment:
      <<: *app-env
      # The suite creates and drops netwatch_test_* databases alongside this
      # one and never writes to the database named here.
      TEST_DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-netwatch}:${POSTGRES_PASSWORD:-netwatch}@postgres:5432/${POSTGRES_DB:-netwatch}
    depends_on: *needs-postgres

volumes:
  netwatch-pgdata:
    driver: local

# ─────────────────────────────────────────────────────────────────────────────
# Operational notes
#
# The database
#   This postgres service is for development. In a real deployment point
#   DATABASE_URL at a managed PostgreSQL instance and do not start it: you want
#   someone else running backups, failover and minor-version upgrades. Use
#   PG_SSLMODE=require (verify-full if you can pin the CA) whenever the
#   connection leaves the host.
#
#   The image is pinned to a patch release of PostgreSQL 16. A major-version
#   change is not a tag edit — the on-disk format differs, and the server will
#   refuse to start against a data directory from another major version. Use
#   pg_upgrade or dump and restore.
#
# Connection budget
#   PostgreSQL's default max_connections is 100 and each connection costs real
#   memory. The split topology can hold replicas x GUNICORN_WORKERS x
#   PG_POOL_MAX (2 x 4 x 4 = 32) plus the engine's 2. Raise max_connections, or
#   put pgbouncer in front, before scaling much past that.
#
# Live packet capture
#   The shipped engine generates synthetic traffic and needs no privileges. To
#   capture real traffic you must add, for that service only:
#       cap_add: [NET_ADMIN, NET_RAW]
#       network_mode: host
#   That is a genuine privilege increase: host networking removes network
#   namespace isolation, and NET_RAW permits arbitrary packet crafting. Grant it
#   to the engine container alone, never to the web tier, and keep read_only
#   and no-new-privileges in place.
#
# Exposure
#   The API has no authentication or rate limiting. Ports are bound to
#   127.0.0.1 so nothing is reachable off-host by default. Put a reverse proxy
#   in front for TLS, authn and rate limiting before changing that.
#
# Backups
#   pg_dump, from the host or a sidecar:
#       docker compose exec postgres pg_dump -U netwatch -Fc netwatch > netwatch.dump
#   A file copy of a running data directory is not a backup. For
#   point-in-time recovery you want continuous WAL archiving, which is the main
#   argument for letting a managed service do this.
