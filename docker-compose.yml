# NetWatch SOC — container topology.
#
#   docker compose up -d --build              PostgreSQL + engine + API
#   docker compose --profile sqlite up -d     single container, no database
#   docker compose --profile test run --rm tests
#   docker compose --profile bench run --rm benchmark
#   docker compose --profile validate run --rm validate
#
# The default topology is PostgreSQL-backed and splits the writer from the
# readers: one engine process owns packet capture and detection, and any number
# of API workers serve queries. That split is the reason for PostgreSQL — with
# SQLite the single-writer constraint forces engine and API into one process
# (the `sqlite` profile below), which is fine for a demo and wrong for anything
# that needs to scale reads.
#
# Defence in depth throughout: non-root, read-only root filesystem, all Linux
# capabilities dropped, privilege escalation blocked, no host network access.
# See the note at the bottom about live packet capture, which is the one mode
# that genuinely needs elevated privileges.

x-hardening: &hardening
  # Blocks setuid binaries from gaining privileges — stops a compromised
  # process escalating even if such a binary exists in the image.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m
  # Gunicorn's worker heartbeat lives in /dev/shm (see gunicorn.conf.py).
  shm_size: 64m
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-app-env: &app-env
  NETWATCH_DB_URL: postgresql://netwatch:${POSTGRES_PASSWORD:-netwatch}@postgres:5432/netwatch
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

x-app-build: &app-build
  build:
    context: .
    target: runtime
    args:
      PYTHON_IMAGE: python:3.11-slim-bookworm
  image: netwatch-soc:latest

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  # The schema is created by the application on startup (DatabaseManager
  # renders it through the PostgreSQL dialect), so there is no migration step
  # and no init SQL to drift out of sync with the code.
  postgres:
    image: postgres:16-alpine
    container_name: netwatch-postgres
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    environment:
      POSTGRES_DB: netwatch
      POSTGRES_USER: netwatch
      # Override in a .env file or the environment. The default exists so
      # `docker compose up` works out of the box on a laptop; it is not a
      # credential for anything reachable, since no port is published.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netwatch}
      # Deterministic collation, so ORDER BY does not depend on the host.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - netwatch-pgdata:/var/lib/postgresql/data
    # No `ports:` — PostgreSQL is reachable only on the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netwatch -d netwatch"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── detection engine (the writer) ─────────────────────────────────────────
  engine:
    <<: [*app-build, *hardening]
    container_name: netwatch-engine
    command: ["python", "engine.py"]
    entrypoint: []           # override gunicorn; this service serves no HTTP
    environment:
      <<: *app-env
      NETWATCH_SIMULATE: "1"
      NETWATCH_RATE_PPS: "95"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No HTTP surface, so health is "is the database still advancing?".
      test:
        - CMD
        - python
        - -c
        - |
          import os,sys,time,psycopg
          c=psycopg.connect(os.environ['NETWATCH_DB_URL'])
          n=c.execute('SELECT COUNT(*) FROM packets WHERE ts > %s',
                      (time.time()-120,)).fetchone()[0]
          sys.exit(0 if n > 0 else 1)
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── API + dashboard (the readers) ─────────────────────────────────────────
  web:
    <<: [*app-build, *hardening]
    environment:
      <<: *app-env
      # No engine in these processes, so multiple workers are safe.
      NETWATCH_SIMULATE: "0"
      GUNICORN_WORKERS: "4"
      GUNICORN_THREADS: "4"
      # Trust X-Forwarded-* only from the proxy network in front of this.
      GUNICORN_FORWARDED_ALLOW_IPS: "172.16.0.0/12"
    ports:
      # Bound to loopback: this app has no authentication, so it must sit
      # behind a reverse proxy that terminates TLS and authenticates before it
      # is reachable off-host. Change to "5001:5001" only deliberately.
      - "127.0.0.1:5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json,sys,urllib.request
          d=json.load(urllib.request.urlopen('http://127.0.0.1:5001/api/health',timeout=4))
          sys.exit(0 if d.get('status')=='ok' and d.get('table_count')==9 else 1)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # ── all-in-one over SQLite (profile: sqlite) ──────────────────────────────
  # No database server. One process owns both the engine and the API, because
  # SQLite permits exactly one writer. gunicorn.conf.py refuses to start this
  # with more than one worker.
  netwatch:
    <<: [*app-build, *hardening]
    container_name: netwatch-soc
    profiles: ["sqlite"]
    environment:
      NETWATCH_DB: /data/netwatch.db
      NETWATCH_SIMULATE: "1"
      GUNICORN_WORKERS: "1"
      GUNICORN_THREADS: "8"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: UTC
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - netwatch-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json,sys,urllib.request
          d=json.load(urllib.request.urlopen('http://127.0.0.1:5001/api/health',timeout=4))
          sys.exit(0 if d.get('status')=='ok' and d.get('table_count')==9 else 1)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M

  # ── tests (profile: test) ─────────────────────────────────────────────────
  # Runs the full suite against the PostgreSQL service, which is the point:
  # the same tests that pass on SQLite have to pass on the deployment backend.
  tests:
    build:
      context: .
      target: test
    image: netwatch-soc:test
    profiles: ["test"]
    <<: *hardening
    read_only: false          # pytest writes temporary databases and captures
    restart: "no"
    entrypoint: []
    command: ["python", "-m", "pytest", "-q"]
    environment:
      <<: *app-env
      NETWATCH_TEST_DB_URL: postgresql://netwatch:${POSTGRES_PASSWORD:-netwatch}@postgres:5432/netwatch
    depends_on:
      postgres:
        condition: service_healthy

  # ── throughput benchmark (profile: bench) ─────────────────────────────────
  benchmark:
    build:
      context: .
      target: test
    image: netwatch-soc:test
    profiles: ["bench"]
    <<: *hardening
    read_only: false
    restart: "no"
    entrypoint: []
    command: ["python", "benchmark.py", "--runs", "6", "--warmup", "1",
              "--json", "/results/benchmark.json"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: UTC
    volumes:
      - ./results:/results

  # ── PCAP replay validation (profile: validate) ────────────────────────────
  validate:
    build:
      context: .
      target: test
    image: netwatch-soc:test
    profiles: ["validate"]
    <<: *hardening
    read_only: false
    restart: "no"
    entrypoint: []
    command: ["sh", "-c",
              "python -m tools.make_pcaps && \
               python -m tests.replay --json /results/replay.json --persist && \
               python -m tools.noise_experiment --json /results/noise.json --persist"]
    environment:
      <<: *app-env
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./results:/results
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  netwatch-pgdata:
    driver: local
  netwatch-data:
    driver: local

# ─────────────────────────────────────────────────────────────────────────────
# Operational notes
#
# Why PostgreSQL is the default
#   The engine writes continuously while the API reads. SQLite allows one
#   writer, so scaling reads means either sharing a filesystem between
#   containers (which needs POSIX advisory locks and shared mmap — a local
#   Docker volume qualifies, NFS does not) or collapsing everything into one
#   process. PostgreSQL removes the constraint; the `sqlite` profile remains
#   for a single-container demo with no database server to run.
#
# Schema management
#   There is no migration tool. DatabaseManager renders one schema definition
#   through the active dialect and applies it with CREATE TABLE IF NOT EXISTS
#   at startup, so a fresh volume and an existing one converge on the same
#   shape. That is adequate because the schema is additive so far; a column
#   type change would need a real migration and this would have to grow one.
#
# Credentials
#   POSTGRES_PASSWORD defaults to a development value so `docker compose up`
#   works unmodified. PostgreSQL publishes no port, so it is reachable only
#   from the compose network. Set POSTGRES_PASSWORD in a .env file for anything
#   beyond a laptop, and use a secrets manager beyond that.
#
# Live packet capture
#   The shipped engine generates synthetic traffic and needs no privileges. To
#   capture real traffic with pcap_io.live_sniffer() you must add, for the
#   engine service only:
#       cap_add: [NET_ADMIN, NET_RAW]
#       network_mode: host
#   That is a genuine privilege increase: host networking removes network
#   namespace isolation, and NET_RAW permits arbitrary packet crafting. Grant
#   it to the engine container alone, never to the web tier, and keep
#   read_only and no-new-privileges in place.
#
# Exposure
#   The API has no authentication or rate limiting. Ports are bound to
#   127.0.0.1 so nothing is reachable off-host by default. Put a reverse proxy
#   in front for TLS, authn and rate limiting before changing that.
#
# Backups
#   pg_dump against the postgres service. For the sqlite profile, use
#   `sqlite3 /data/netwatch.db ".backup /backup/x.db"` rather than cp — a plain
#   copy of a live WAL database can be torn.
