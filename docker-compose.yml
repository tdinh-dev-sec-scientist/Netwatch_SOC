# NetWatch — container topology.
#
#   docker compose up -d --build        PostgreSQL + engine + API
#   docker compose --profile test run --rm tests
#   docker compose --profile bench run --rm benchmarks
#
# The default shape is the split topology: one process owns ingest, and the
# API tier is stateless and scalable. That separation is the whole point of
# moving persistence to PostgreSQL — with a single-writer file database the
# API had to live in the writer's process.
#
# Security posture is defence-in-depth: non-root, read-only root filesystem,
# every Linux capability dropped, privilege escalation blocked, and no host
# network access. See the note at the bottom about live packet capture, which
# is the one mode that genuinely needs elevated privileges.

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  shm_size: 64m
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-app-env: &app-env
  NETWATCH_DATABASE_URL: postgresql+psycopg://netwatch:${POSTGRES_PASSWORD:-netwatch}@db:5432/netwatch
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  TZ: UTC

services:
  db:
    # Overridable so the stack can be built from a registry mirror (or an
    # internal one) without editing the file: set POSTGRES_IMAGE/PYTHON_IMAGE.
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: netwatch-db
    environment:
      POSTGRES_USER: netwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netwatch}
      POSTGRES_DB: netwatch
      # Data checksums catch silent corruption at read time. Cheap on modern
      # hardware and worth having on a database you would otherwise trust
      # blindly.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      # Tuned for an ingest workload on a small box. shared_buffers at ~25% of
      # a 1 GB allocation; a large max_wal_size so a burst of COPY does not
      # force a checkpoint mid-batch.
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_connections=100
    volumes:
      - netwatch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netwatch -d netwatch"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  # One-shot: bring the schema to head before anything else starts. Runs the
  # real migrations, not create_all, so what CI and production apply is the
  # same thing.
  migrate:
    build:
      context: .
      target: runtime
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim-bookworm}
    image: netwatch:latest
    container_name: netwatch-migrate
    <<: *hardening
    restart: "no"
    # Two steps, because they have different owners. Alembic owns the shape
    # of the database and is versioned. The reference tables (protocols,
    # detector catalog, ATT&CK catalog) are derived from the code being
    # deployed, so they are refreshed on every deploy instead of being frozen
    # into a migration.
    entrypoint: ["sh", "-c"]
    command:
      - "alembic upgrade head && python -m netwatch.cli seed"
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy

  # The writer. Owns ingest; serves no HTTP.
  engine:
    build:
      context: .
      target: runtime
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim-bookworm}
    image: netwatch:latest
    container_name: netwatch-engine
    <<: *hardening
    entrypoint: []
    command:
      - python
      - -m
      - netwatch.cli
      - engine
      - --rate-pps
      - "${NETWATCH_RATE_PPS:-400}"
      - --persist-workers
      - "2"
      - --batch-size
      - "1000"
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # No HTTP surface, so health is "is the database still advancing?".
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys,psycopg,datetime as dt;
          c=psycopg.connect(os.environ['NETWATCH_DATABASE_URL'].replace('postgresql+psycopg','postgresql'));
          n=c.execute(\"SELECT COUNT(*) FROM packets WHERE ts > now() - interval '2 minutes'\").fetchone()[0];
          sys.exit(0 if n > 0 else 1)"
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 768M

  # The readers. Stateless, horizontally scalable.
  api:
    build:
      context: .
      target: runtime
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim-bookworm}
    image: netwatch:latest
    <<: *hardening
    environment:
      <<: *app-env
      GUNICORN_WORKERS: "2"
      GUNICORN_THREADS: "8"
      GUNICORN_LOGLEVEL: info
      NETWATCH_DB_POOL_SIZE: "5"
      # GUNICORN_FORWARDED_ALLOW_IPS is deliberately unset: with no reverse
      # proxy in this stack, trusting X-Forwarded-For would let any client
      # forge its source address in the logs. When you put a proxy in front,
      # set it to that proxy's address — gunicorn takes a comma-separated list
      # of individual addresses or "*", not a CIDR block.
    ports:
      # Bound to loopback: this API has no authentication, so it must sit
      # behind a reverse proxy that terminates TLS and authenticates before it
      # is reachable off-host. Change to "5001:5001" only deliberately.
      - "127.0.0.1:5001:5001"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json,sys,urllib.request
          d=json.load(urllib.request.urlopen('http://127.0.0.1:5001/api/health',timeout=4))
          sys.exit(0 if d.get('status')=='ok' and d.get('schema_complete') else 1)
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M

  # ── test (profile: test) ──────────────────────────────────────────────────
  tests:
    build:
      context: .
      target: test
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim-bookworm}
    image: netwatch:test
    profiles: ["test"]
    <<: *hardening
    read_only: false          # pytest and coverage write temporary files
    restart: "no"
    entrypoint: []
    command: ["python", "-m", "pytest", "-q", "--cov"]
    environment:
      <<: *app-env
      NETWATCH_TEST_DATABASE_URL: postgresql+psycopg://netwatch:${POSTGRES_PASSWORD:-netwatch}@db:5432/netwatch
    depends_on:
      db:
        condition: service_healthy

  # ── benchmarks (profile: bench) ───────────────────────────────────────────
  benchmarks:
    build:
      context: .
      target: runtime
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim-bookworm}
    image: netwatch:latest
    profiles: ["bench"]
    <<: *hardening
    read_only: false          # writes benchmarks/results/*.json
    restart: "no"
    entrypoint: []
    command: ["python", "-m", "benchmarks.pipeline_benchmark"]
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  netwatch-pgdata:
    driver: local

# ─────────────────────────────────────────────────────────────────────────────
# Operational notes
#
# Credentials
#   POSTGRES_PASSWORD defaults to a development value. Set it in a .env file
#   (or use Docker secrets) before running this anywhere real.
#
# Live packet capture
#   The shipped engine generates synthetic traffic and needs no privileges. To
#   capture real traffic you must add, for the engine service only:
#       cap_add: [NET_ADMIN, NET_RAW]
#       network_mode: host
#   That is a genuine privilege increase: host networking removes network
#   namespace isolation and NET_RAW permits arbitrary packet crafting. Grant it
#   to the engine container alone, never to the API tier, and keep read_only
#   and no-new-privileges in place.
#
# Exposure
#   The API has no authentication or rate limiting. Ports are bound to
#   127.0.0.1 so nothing is reachable off-host by default. Put a reverse proxy
#   in front for TLS, authn and rate limiting before changing that.
#
# Scaling the API tier
#   `docker compose up -d --scale api=4`. The API is stateless; the engine is
#   not, and must stay at one replica per database.
