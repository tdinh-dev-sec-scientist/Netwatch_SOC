# NetWatch SOC -- sourcetype configuration
# Install to $SPLUNK_HOME/etc/apps/netwatch/local/props.conf (or search-head
# equivalent) and restart Splunk.

[netwatch:incident]

# The forwarder POSTs to /services/collector/event with an explicit "time"
# key, so Splunk takes _time from that value and NO timestamp extraction runs
# here. TIME_PREFIX / TIME_FORMAT would be dead configuration on this
# sourcetype -- deliberately omitted rather than added as decoration. If you
# ever switch to the /raw endpoint, you must add them back or every event will
# be stamped at ingest time.
# Verify with the SPL in README.md ("Verifying the timestamp mapping").

KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
AUTO_KV_JSON = true

# `description` carries the detector's full human-readable reason and
# `evidence.qname` can hold a long encoded tunnelling label. The default
# 10000-byte truncation is comfortably clear of both, but be explicit.
TRUNCATE = 20000

category = Network & Security
description = NetWatch SOC network detections (one event per deduplicated detection)

# The engine's column is dst_ip. The forwarder sends every column raw and
# unmodified, so CIM's dest_ip is created here at search time instead of being
# invented in the Python. Both names work in SPL; the dashboard uses dst_ip.
FIELDALIAS-netwatch_cim_dest = dst_ip AS dest_ip
FIELDALIAS-netwatch_cim_dest_port = dst_port AS dest_port
FIELDALIAS-netwatch_cim_transport = protocol AS transport

# Severity as a sortable number. CRITICAL is 1 so `sort severity_rank` puts
# the worst first; Splunk would otherwise sort the strings alphabetically and
# rank CRITICAL under HIGH.
EVAL-severity_rank = case(severity=="CRITICAL",1,severity=="HIGH",2,severity=="MEDIUM",3,severity=="LOW",4,severity=="INFO",5)

# RFC1918 classification of the recorded source address. This says which side
# of the network boundary the address sits on -- NOT who the attacker is. For
# some detectors (suspicious_dns NXDOMAIN storms, amplification reflection)
# src_ip is the responder, so "internal_src" can legitimately mean the victim.
EVAL-src_zone = if(cidrmatch("10.0.0.0/8",src_ip) OR cidrmatch("172.16.0.0/12",src_ip) OR cidrmatch("192.168.0.0/16",src_ip),"internal","external")
EVAL-dst_zone = if(cidrmatch("10.0.0.0/8",dst_ip) OR cidrmatch("172.16.0.0/12",dst_ip) OR cidrmatch("192.168.0.0/16",dst_ip),"internal","external")
