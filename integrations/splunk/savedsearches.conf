# NetWatch SOC -- scheduled alerts
# Install to $SPLUNK_HOME/etc/apps/netwatch/local/savedsearches.conf.
#
# Every search is scheduled over a window wider than its cron interval so a
# late-arriving forwarder batch is not missed, and every one sets
# alert.suppress on a field that identifies the thing being alerted on rather
# than the packet that exposed it. Without suppression, a detector that
# re-alerts after its cooldown expires reopens the same ticket every cycle.
#
# Thresholds below are NOT independent detection logic -- the engine has
# already applied its own (config.py). These select which of its detections
# are worth waking someone for.


#===========================================================================
# 1. Critical detection, any type
#---------------------------------------------------------------------------
# WHY: CRITICAL is assigned by the detector, not by volume. In the shipped
# config it covers c2_beacon, dns_tunnel, syn_flood, udp_flood, arp_spoof
# binding conflicts, and http_anomaly at score >= 0.9.
#
# FALSE POSITIVES TO EXPECT:
#  - syn_flood / udp_flood are rate-based (config: 10s windows). Load tests,
#    backup windows, iperf runs and a misconfigured health-check will all trip
#    them. Volumetric CRITICALs are the noisiest class here by a wide margin.
#  - arp_spoof "binding conflict" fires on any IP that changes MAC. A DHCP
#    lease handed to a new device, an HA failover moving a VIP, or a laptop
#    switching dock/wifi all produce a real conflict that is not an attack.
#  - http_anomaly matches signatures in the request line. A security scanner
#    you run yourself, or a developer pasting a payload into a search box,
#    look identical to the real thing at this layer.
# TRIAGE: check src_zone. An external source hitting an internal target is
# worth attention; an internal host tripping a volumetric rule at 02:00 is
# probably your own backup job.
#===========================================================================
[NetWatch - Critical detection]
search = index=netwatch sourcetype=netwatch:incident severity=CRITICAL \
  | table _time severity threat_type detector src_ip src_zone dst_ip dst_zone protocol confidence description incident_key
description = Any CRITICAL detection from the NetWatch engine. Expect volumetric (syn_flood/udp_flood) and ARP rebinding false positives; triage on src_zone.
dispatch.earliest_time = -10m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = incident_key
counttype = number of events
relation = greater than
quantity = 0


#===========================================================================
# 2. C2 beaconing with very low jitter
#---------------------------------------------------------------------------
# WHY: the detector already requires >= 8 callbacks in a 30-minute window with
# jitter_ratio <= 0.12 (config.c2_beacon). This search keeps only the tightest
# half of that band, where automation is near-certain.
#
# FALSE POSITIVES TO EXPECT:
#  - This is the single most FP-prone rule in the set, because low jitter is
#    exactly what well-behaved software does. Monitoring agents, NTP, EDR
#    heartbeats, software update checks, RSS/calendar polling and CI runners
#    all beacon on a fixed interval with near-zero jitter.
#  - Real malware often jitters MORE than legitimate polling to evade this
#    exact detection, so a strict jitter threshold biases toward catching
#    lazy implants and your own monitoring stack.
# TRIAGE: the destination is the discriminator, not the interval. Build an
# allowlist of known-good beacon destinations and maintain it; without one
# this rule will train an analyst to ignore it within a week.
#===========================================================================
[NetWatch - C2 beacon, low jitter]
search = index=netwatch sourcetype=netwatch:incident threat_type=c2_beacon \
  | where 'evidence.jitter_ratio' <= 0.06 \
  | table _time src_ip src_zone dst_ip dst_zone protocol 'evidence.callbacks' 'evidence.mean_interval_s' 'evidence.jitter_ratio' 'evidence.destination' confidence description incident_key
description = Periodic callbacks at jitter <= 6 percent. HIGH false-positive rate by design - legitimate polling software beacons this cleanly. Allowlist destinations.
dispatch.earliest_time = -35m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 6h
alert.suppress.fields = incident_key
counttype = number of events
relation = greater than
quantity = 0


#===========================================================================
# 3. Outbound data volume from an internal host to an external destination
#---------------------------------------------------------------------------
# WHY: data_exfil triggers at 5 MB in 300s to a single external destination
# (config.data_exfil.bytes_threshold). The src_zone/dst_zone check below is
# the part that makes it worth alerting on: internal -> external only.
#
# FALSE POSITIVES TO EXPECT:
#  - Cloud backup and file sync (Dropbox/OneDrive/Backblaze) will exceed this
#    constantly and are the dominant FP source.
#  - CI/CD pushing build artifacts or container layers to a registry.
#  - Video calls, screen sharing and large email attachments.
#  - OS and container image updates pulling in the other direction can trip it
#    if the detector attributes the flow to the internal host.
# TRIAGE: 5 MB is low for a modern network. Expect to raise the threshold in
# config.py for real traffic, or allowlist destination ASNs. Volume alone is
# weak evidence; volume to a destination the host has never contacted before
# is the version worth paging on.
#===========================================================================
[NetWatch - Outbound transfer, internal to external]
search = index=netwatch sourcetype=netwatch:incident threat_type=data_exfil src_zone=internal dst_zone=external \
  | table _time src_ip dst_ip protocol 'evidence.megabytes' 'evidence.packet_count' 'evidence.transport' confidence description incident_key \
  | sort - 'evidence.megabytes'
description = Sustained outbound transfer from an internal host to an external destination. Expect cloud backup, file sync and CI artifact uploads to dominate.
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = incident_key
counttype = number of events
relation = greater than
quantity = 0


#===========================================================================
# 4. Lateral movement fan-out on admin services
#---------------------------------------------------------------------------
# WHY: internal -> internal connections to SMB/RDP/WinRM/VNC across >= 3
# distinct hosts in 300s (config.lateral_movement). Host fan-out on admin
# protocols is one of the higher-signal network behaviours available without
# endpoint telemetry.
#
# FALSE POSITIVES TO EXPECT:
#  - Anything whose job is to touch many machines: vulnerability scanners,
#    SCCM/WSUS, Ansible/Puppet runs, backup agents, asset inventory, and
#    monitoring pollers. These will be your entire alert volume on day one.
#  - A sysadmin's own workstation during a patch window.
#  - Domain controllers and jump boxes, which fan out by design.
# TRIAGE: this rule is only useful with an allowlist of known fan-out sources.
# Alert on a source that is NOT on that list rather than on the behaviour.
# The search below raises the bar to 5 hosts to cut the worst of it; tune
# against your own inventory before trusting it.
#===========================================================================
[NetWatch - Lateral movement fan-out]
search = index=netwatch sourcetype=netwatch:incident threat_type=lateral_movement \
  | where 'evidence.distinct_targets' >= 5 \
  | table _time src_ip 'evidence.distinct_targets' 'evidence.targets{}' 'evidence.service_names' confidence description incident_key
description = Internal host opening admin sessions to 5+ internal hosts. Requires an allowlist of legitimate fan-out sources (scanners, SCCM, backup) to be usable.
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 2h
alert.suppress.fields = incident_key
counttype = number of events
relation = greater than
quantity = 0


#===========================================================================
# 5. One source, multiple ATT&CK tactics -- kill-chain progression
#---------------------------------------------------------------------------
# WHY: this is the one search here that is genuinely additive rather than a
# filter on a single detector. A source seen in three or more distinct ATT&CK
# tactics inside an hour is a different claim from any one detection: it is
# the shape of an intrusion progressing, and no individual detector can see
# it because each only knows its own signal.
#
# FALSE POSITIVES TO EXPECT:
#  - A vulnerability scanner trips Discovery + Reconnaissance + Initial Access
#    in one pass and will look exactly like a real intrusion. This is the
#    main FP and it is a big one.
#  - A single noisy host with an unrelated misconfiguration can accumulate
#    tactics over an hour without any of them being related.
#  - Because src_ip is the recorded address rather than an attacker verdict,
#    a busy DNS resolver or NTP reflector can aggregate tactics that belong to
#    different victims. Check src_zone and the per-tactic detail before acting.
# TRIAGE: read the tactics list, not the count. Discovery + Credential Access
# + Lateral Movement is a real progression; Impact + Impact + Discovery is
# probably three unrelated things on a busy host.
#===========================================================================
[NetWatch - Source active across multiple ATT&CK tactics]
search = index=netwatch sourcetype=netwatch:incident \
  | spath output=tactic path=tactics{} \
  | mvexpand tactic \
  | stats dc(tactic) AS tactic_count values(tactic) AS tactics dc(incident_key) AS incidents \
          values(threat_type) AS threat_types min(severity_rank) AS worst by src_ip src_zone \
  | where tactic_count >= 3 \
  | eval worst_severity=case(worst==1,"CRITICAL",worst==2,"HIGH",worst==3,"MEDIUM",worst==4,"LOW",worst==5,"INFO") \
  | fields src_ip src_zone worst_severity tactic_count tactics incidents threat_types \
  | sort - tactic_count - incidents
description = One source address seen across 3+ ATT&CK tactics in an hour. Vulnerability scanners produce this signature too - check whether the tactic sequence is a plausible progression.
dispatch.earliest_time = -60m
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 4h
alert.suppress.fields = src_ip
counttype = number of events
relation = greater than
quantity = 0
