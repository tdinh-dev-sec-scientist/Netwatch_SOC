limitations:
- 'A smoke test, not evidence: every slice comes from the development set NetWatch
  was tuned on, and each was chosen because NetWatch detects it.'
- Each attack is a short slice (15 s to 12 min) of a longer attack, on one 45-minute
  timeline.
- The stitched timeline counts as one host, so per-host-hour rates on this pack are
  not comparable with the full packs.
- 'Not a fair test of signature engines: packets are truncated to 256 bytes and slices
  from different captures are stitched together, so payload signatures cannot match
  and stream reassembly breaks. Suricata on this pack fires mostly engine anomaly
  events (checksums, stream state). Compare engines on the full packs.'
- One 2018 lab network on AWS. A different network would surface different false
  positives.
