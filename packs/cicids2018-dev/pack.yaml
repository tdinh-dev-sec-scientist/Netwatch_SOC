title: 'CSE-CIC-IDS2018: development set'
description: NetWatch was tuned on these captures. Scores here say how well an engine
  fits them, not how well it generalises.
source:
  name: CSE-CIC-IDS2018
  publisher: Canadian Institute for Cybersecurity (UNB) and the Communications Security
    Establishment
  url: https://www.unb.ca/cic/datasets/ids-2018.html
  license: See the dataset page; cite the paper below when using it.
  citation: Sharaf, Habibi Lashkari and Ghorbani, "Toward Generating a New Intrusion
    Detection Dataset and Intrusion Traffic Characterization", ICISSP 2018.
notes:
- Attacker/victim addresses and windows follow the dataset's published attack schedule.
  The schedule is in the lab's local time (UTC-4 in the captures); windows below
  are converted to UTC and padded by 10 minutes each side.
- 'Every attacker address was confirmed against the captures themselves: it is the
  dominant external talker to the victim inside its window and absent outside it
  (eval/cicids2018/talkers.py prints this per hour).'
- Only labelled attacks count as true positives. The victims are AWS hosts with RDP/SSH
  exposed to the internet, so the 'benign' traffic contains real, unlabelled internet
  scanning and brute forcing. Alerts on it are counted as false positives against
  the labels and then broken down by cause in the report.
- Exported from eval/cicids2018/ground_truth.json by export_packs.py.
- Windows are padded by 10 minutes each side; onset is the scheduled start of the
  attack, for detection latency.
