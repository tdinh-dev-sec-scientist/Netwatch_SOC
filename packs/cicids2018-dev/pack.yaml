limitations:
- NetWatch was tuned on these captures. Scores here say how well an engine fits them,
  not how well it generalises.
- One 2018 lab network on AWS. A different network would surface different false
  positives.
- The victims expose RDP and SSH to the internet, so the benign traffic holds real,
  unlabelled internet attacks. Alerts on them count as false positives against the
  labels.
- Published work has found labelling errors in this dataset (Liu et al., "Error Prevalence
  in NIDS datasets", IEEE CNS 2022). These windows and addresses were checked against
  the captures, but not packet by packet.
